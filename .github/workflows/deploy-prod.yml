name: Deploy Prod

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (ex: v1.2.3)'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ~/env

            echo "Login to Docker Hub"
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

            echo "Update image tag in compose.yaml"
            sed -i "s|image: akiagaming/hello_kitty:.*|image: akiagaming/hello_kitty:${{ github.event.inputs.tag }}|g" docker-compose-hello-kitty.yaml

            echo "Stopping old containers"
            docker stop app_hello_kitty

            echo "Starting new containers"
            docker compose -f docker-compose-hello-kitty.yaml up -d

            echo "Cleanup unused images"
            docker image prune -a -f